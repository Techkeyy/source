services:
  - type: web
    name: source
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: source
      - key: SESSION_SECRET
        generateValue: true
      - key: INFERENCE_PROVIDER
        value: openrouter-gemma
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: google/gemma-4-26b-a4b-it:free
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_MODEL
        value: deepseek-flash
      - key: SERPAPI_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
